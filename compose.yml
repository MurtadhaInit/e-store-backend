name: e-store
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecomm-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DSN=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(db:3306)/${MYSQL_DATABASE}?parseTime=true&multiStatements=true
    ports:
      - 4210:4210
    networks:
      - ecomm-net
    volumes:
      - ./:/app:rw

networks:
  ecomm-net:
    driver: bridge

volumes:
  mysql_data: