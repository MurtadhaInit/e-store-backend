version: "2"
sql:
  - engine: "mysql"
    schema: "db/migrations/"
    queries: "db/queries/"
    gen:
      go:
        emit_json_tags: true
        package: "repository"
        out: "internal/repository"
        overrides:
          - column: "customers.password_hash"
            go_struct_tag: 'json:"-"'
          - column: "customers.birth_day"
            go_type: "string"
