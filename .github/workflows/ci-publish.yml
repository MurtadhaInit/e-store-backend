name: CI and publish
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

# Cancel in-progress PR runs when a new commit lands on the same PR.
# Don't cancel main/tag runs — those produce releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # match the version in mise.toml (local runs)

  go-test:
    name: Test (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...

  sqlc-diff:
    # in case anyone has forgotten to `sqlc generate` after a SQL schema or query change
    name: SQLC (sqlc diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sqlc-dev/setup-sqlc@v5.0.0
        with:
          sqlc-version: "1.31.1" # match the version in mise.toml (local runs)
      - run: sqlc diff

  sqlc-vet:
    name: SQLC (sqlc vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: sqlc-dev/setup-sqlc@v5.0.0
        with:
          sqlc-version: "1.31.1" # match the version in mise.toml (local runs)
      - run: sqlc vet

  trivy-fs:
    name: Trivy (filesystem scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to GitHub Code Scanning
    steps:
      - uses: actions/checkout@v6
      # Scanner selection, severity policy and skip-dirs live in trivy.yaml.
      # Keeping only operational flags inline.
      - name: Run Trivy (repo mode)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          trivy-config: trivy.yaml
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: 0

      - name: Upload Trivy filesystem SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  sqlfluff:
    name: Lint (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "sqlfluff==4.2.1"
      - run: sqlfluff lint db/

  build-image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [golangci, go-test, sqlc-diff, sqlc-vet, sqlfluff, trivy-fs]
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # SLSA build provenance attestations
      attestations: write
      artifact-metadata: write # create linked artifact metadata for registry attestations
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      # docker/metadata-action already does this, but Trivy's image-ref doesn't
      - name: Normalize image name (GHCR is case-sensitive — must be lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            # Sortable immutable tag for Flux ImagePolicy (continuous deploy from main).
            # Timestamp-first so it orders correctly both numerically and alphabetically.
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Don't embed BuildKit attestations into the image index — Provenance and
          # SBOM are produced below as signed GitHub Artifact Attestations instead.
          provenance: false
          sbom: false

      # Signed SLSA provenance, stored in GitHub's attestation API AND pushed to the
      # registry as an OCI referrer
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (Syft)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  trivy-image:
    name: Trivy (image scan)
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
      security-events: write # upload SARIF to GitHub Code Scanning
    steps:
      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build-image.outputs.image }}@${{ needs.build-image.outputs.digest }}
          scan-type: image
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 0

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
