name: quality-checks
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
  sqlc-diff:
    # in case anyone has forgotten to `sqlc generate` after an SQL schema or query change
    name: sqlc diff
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: sqlc-dev/setup-sqlc@v4.0.0
      with:
        sqlc-version: '1.29.0'
    - run: sqlc diff
  sqlc-vet:
    name: sqlc vet
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: sqlc-dev/setup-sqlc@v4.0.0
      with:
        sqlc-version: '1.29.0'
    - run: sqlc vet
